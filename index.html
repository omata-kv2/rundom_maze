<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#171713">
  <title>YAJU ESCAPE v23.6</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="game"></div>  
  <div id="look-pad"></div>
  
  <div id="loading-screen" class="loading-overlay hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <div id="loading-text">STAGE GENERATING...</div>
    </div>
  </div>

  <div id="hud">
    <img id="rocket-hud" src="./assets/items/rocket.png" class="hidden" alt="Rocket">
    <div class="hud-top">
      <!-- 通常時スタミナパネル -->
      <div class="panel" id="stamina-panel">
        <div class="hud-label">STAMINA</div>
        <div class="meter"><div id="stamina-fill"></div></div>
        <div id="stamina-text">20 / 20</div>
      </div>
      <!-- ボス戦時HPパネル -->
      <div class="panel hidden" id="hp-panel">
        <div class="hud-label">BOSS HP</div>
        <div class="meter"><div id="hp-fill"></div></div>
        <div id="hp-text">20 / 20</div>
      </div>

      <div class="panel status-panel">
        <div class="hud-label">FLOOR / STATUS</div>
        <div id="floor-display">1F</div>
        <div id="fps-counter" style="font-size:10px; color:#aaa; margin-top:2px;">FPS: --</div>
      </div>  
      <div class="compass-container" id="compass-container">
        <div class="compass-wrapper">
          <div class="compass-label">EXIT</div>
          <div class="compass-circle">
            <div id="exit-needle" class="needle" style="background-color: #8aff9d;"></div>
            <div id="exit-distance" class="distance-text">0m</div>
          </div>
        </div>
        <div class="compass-wrapper">
          <div class="compass-label">YAJU</div>
          <div class="compass-circle" id="radar"></div>
        </div>
      </div>
    </div>
    <div id="crosshair">+</div>
    <div id="message" class="message">スタートボタンを押して難易度ルールを設定してください</div>    
    <div id="mobile-controls">
      <div id="joystick"><div id="stick"></div></div>
      <div class="action-buttons">
        <button id="shoot-button" class="btn-action btn-shoot hidden">発射</button>
        <div class="dash-btn-wrapper">
          <svg class="dash-cd-ring" viewBox="0 0 36 36">
            <path class="ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            <path id="dash-cd-path" class="ring-fill" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
          </svg>
          <button id="dash-button" class="btn-action btn-dash">突進</button>
        </div>
        <button id="sprint-button" class="btn-action btn-sprint">走る</button>
      </div>
    </div>
  </div>

  <!-- スタート前：設定ダイアログ -->
  <div id="overlay" class="overlay">
    <div class="dialog">
      <div class="eyebrow">YAJU ESCAPE v23.6</div>
      <h1>YAJU ESCAPE</h1>
      <p>全5階層を脱出するか、ボスステージに挑戦せよ！</p>      
      <div class="settings-group">
        <h3>【ゲームルール設定】</h3>  
        <div class="toggle-row">
          <span>各コンパスの使用</span>
          <label class="switch">
            <input type="checkbox" id="setting-compass" checked>
            <span class="slider round"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span>累進野獣数</span>
          <label class="switch">
            <input type="checkbox" id="setting-progressive-enemies" checked>
            <span class="slider round"></span>
          </label>
        </div>
        <div class="toggle-row">
          <span>最初からボスに挑戦する</span>
          <div class="boss-toggle-wrap">
            <span class="toggle-state-label">OFF</span>
            <label class="switch">
              <input type="checkbox" id="setting-boss-mode">
              <span class="slider round"></span>
            </label>
            <span class="toggle-state-label">ON</span>
          </div>
        </div>
      </div>

      <!-- スタートボタン＆ボス挑戦ボタン重なりコンテナ -->
      <div class="start-action-area">
        <button id="start-button">この設定でゲーム開始</button>
        <div id="boss-challenge-buttons" class="boss-challenge-overlay hidden">
          <button id="boss-world-enemy-btn" class="boss-select-btn">ボス: world enemyに挑戦</button>
          <button id="boss-beast-king-btn" class="boss-select-btn">ボス:獣王に挑戦</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="bgm-yarimasune" src="./assets/sounds/yarimasune.mp3" loop></audio>
  <audio id="se-provoke" src="./assets/sounds/114514.mp3"></audio>
  <audio id="se-boom" src="./assets/sounds/boom.mp3"></audio>
  <audio id="se-start" src="./assets/sounds/start.mp3"></audio>
  <audio id="se-totugeki" src="./assets/sounds/totugeki.mp3"></audio>
  <audio id="se-restart" src="./assets/sounds/restart.mp3"></audio>
  <audio id="se-clear" src="./assets/sounds/clear.mp3"></audio>

  <!-- ゲームオーバー / クリアオーバーレイ -->
  <div id="end-overlay" class="overlay hidden">
    <div class="dialog">
      <div class="eyebrow">YAJU ESCAPE</div>
      <h1 id="end-title">GAME OVER</h1>
      <p id="end-text"></p>
      
      <div id="end-boss-stages-section" class="settings-group hidden" style="margin-top: 12px;">
        <h3>【ボスステージ選択】</h3>
        <button id="end-boss-world-enemy-btn" class="boss-select-btn">ボス: world enemyに挑戦</button>
        <button id="end-boss-beast-king-btn" class="boss-select-btn" style="margin-top:8px;">ボス:獣王に挑戦</button>
      </div>

      <button id="next-floor-button" class="hidden">次の階層へ進む</button>
      <button id="retry-floor-button" class="hidden">同じ階をやり直す</button>
      <button id="restart-button">1階からやり直す</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
