<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#171713">
  <title>YAJU ESCAPE</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="game"></div>
  <div id="hud">
    <img id="rocket-hud" src="./assets/items/rocket.png" class="hidden" alt="Rocket">

    <div class="hud-top">
      <div class="panel">
        <div class="hud-label">STAMINA</div>
        <div class="meter"><div id="stamina-fill"></div></div>
        <div id="stamina-text">20 / 20</div>
      </div>
      <div class="panel status-panel">
        <div class="hud-label">STATUS</div>
        <div id="status">探索中</div>
      </div>
      
      <div class="compass-container">
        <div class="compass-wrapper">
          <div class="compass-label">EXIT</div>
          <div class="compass-circle">
            <div id="exit-needle" class="needle" style="background-color: #8aff9d;"></div>
            <div id="exit-distance" class="distance-text">0m</div>
          </div>
        </div>

        <div class="compass-wrapper">
          <div class="compass-label">YAJU</div>
          <div class="compass-circle" id="radar">
            <!-- 追跡者用コンパス針はJSで動的生成 -->
          </div>
        </div>
      </div>
      
    </div>
    <div id="crosshair">+</div>
    <div id="message" class="message">追跡者を煽り倒してゴールしろ</div>
    <div id="desktop-help">WASD：移動　Shift：走る　マウス：視点　Eキー：挑発　Space：発射　Esc：解除</div>
    <div id="mobile-controls">
      <div id="joystick"><div id="stick"></div></div>
      <div id="look-pad">ここをドラッグして視点操作</div>
      <button id="provoke-button">挑発</button>
      <button id="sprint-button">走る</button>
      <button id="shoot-button" class="hidden">発射</button>
    </div>
  </div>
  <div id="overlay" class="overlay">
    <div class="dialog">
      <div class="eyebrow">3D HORROR()</div>
      <h1>YAJU ESCAPE</h1>
      <p>追跡者を煽り倒してゴールしろ</p>
      <ul>
        <li>ロケットは最大2発。</li>
      </ul>
      <button id="start-button">GAME START</button>
    </div>
  </div>
  
  <video id="capture-video" src="./assets/videos/inmuking.mp4" playsinline webkit-playsinline></video>
  <audio id="bgm-yarimasune" src="./assets/sounds/yarimasune.mp3" loop></audio>
  <audio id="se-provoke" src="./assets/sounds/114514.mp3"></audio>
  <audio id="se-boom" src="./assets/sounds/boom.mp3"></audio>
  <audio id="se-bark" src="./assets/sounds/yaju_bark.mp3"></audio>
  <audio id="se-start" src="./assets/sounds/start.mp3"></audio>
  <audio id="se-restart" src="./assets/sounds/restart.mp3"></audio>
  <audio id="se-clear" src="./assets/sounds/clear.mp3"></audio>

  <div id="end-overlay" class="overlay hidden">
    <div class="dialog">
      <div class="eyebrow">YAJU ESCAPE</div>
      <h1 id="end-title">GAME OVER</h1>
      <p id="end-text"></p>
      <button id="new-stage-button" class="hidden">新しいステージ</button>
      <button id="restart-button">再挑戦</button>
    </div>
  </div>
  <script type="module" src="./game.js"></script>
</body>
</html>
